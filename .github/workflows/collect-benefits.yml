name: Collect subscription benefits hourly
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '0 16 * * *' # 01:00 Asia/Seoul: daily catalogue publication
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/collect-benefits.yml']
permissions:
  contents: write
concurrency:
  group: benefits-database
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s backend/tests -v
      - name: Install browser for public JavaScript pricing pages
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.56,<2'
          python -m playwright install --with-deps chromium
      - name: Research official sources and update SQLite
        id: collect
        continue-on-error: true
        env:
          DALFIT_BROWSER_RENDER_LIMIT: '6'
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python backend/collector.py
      - name: Commit public feed and database
        if: always()
        run: |
          git config user.name 'goodok-benefits-bot'
          git config user.email 'goodok-benefits-bot@users.noreply.github.com'
          git add backend/data/feed.json backend/data/benefits.sqlite backend/data/research-report.json backend/data/research-report.md
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified subscription benefits [skip ci]'
            git push
          fi
      - name: Report research failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
